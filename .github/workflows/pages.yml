name: Deploy GA.IA to GitHub Pages

on:
  push:
    branches:
      - feature/continuous-world-v0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gaia-3x4/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: gaia-3x4
      - name: Test and build
        run: |
          npm test
          npm run verify:docs
          npm run build -- --minify
        working-directory: gaia-3x4
      - name: Assemble static site
        run: |
          mkdir _site
          cp gaia-3x4/index.html gaia-3x4/data.html gaia-3x4/legacy.html _site/
          cp -r gaia-3x4/dist gaia-3x4/surface gaia-3x4/examples gaia-3x4/data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
